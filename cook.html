<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>居家食谱</title>
  <style>
    :root { --ink:#24292f; --muted:#656d76; --line:#d0d7de; --paper:#fff; --wash:#f6f8fa; --green:#1f883d; --green-soft:#ddf4e4; --orange:#bf8700; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--wash); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:inherit; }
    .page { max-width:980px; margin:0 auto; padding:24px 20px 36px; }
    .masthead { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--green); font-size:12px; font-weight:700; letter-spacing:.04em; }
    h1 { margin:3px 0 5px; font-size:clamp(23px,4vw,34px); line-height:1.15; }
    .intro { margin:0; max-width:650px; color:var(--muted); }
    .source-link { display:inline-flex; align-items:center; min-height:40px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--green); text-decoration:none; white-space:nowrap; }
    .source-link:hover { border-color:var(--green); background:var(--green-soft); }
    .section { margin-top:24px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px; }
    h2 { margin:0; font-size:17px; }
    .section-head small { color:var(--muted); }
    .ingredient-bar { display:flex; flex-wrap:wrap; gap:8px; }
    .ingredient { min-height:38px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink); cursor:pointer; }
    .ingredient:hover { border-color:var(--green); }
    .ingredient[aria-pressed="true"] { border-color:var(--green); background:var(--green-soft); color:#116329; font-weight:600; }
    .filter-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:13px; }
    .filter-label { color:var(--muted); font-size:12px; }
    .mode { min-height:34px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--muted); cursor:pointer; }
    .mode[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); background:var(--paper); font-weight:600; }
    .clear { min-height:34px; padding:0 10px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; }
    .clear:hover { color:var(--ink); background:#eaeef2; }
    .result-note { margin:14px 0 0; color:var(--muted); font-size:12px; }
    .recipe-grid, .plant-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .recipe, .plant { display:flex; flex-direction:column; min-width:0; min-height:170px; padding:14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
    .recipe-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .dish-icon { display:grid; place-items:center; flex:none; width:38px; height:38px; border-radius:8px; background:#fff3cd; font-size:22px; }
    .recipe h3, .plant h3 { margin:0; font-size:14px; line-height:1.35; }
    .recipe p, .plant p { margin:9px 0 0; color:var(--muted); font-size:12px; }
    .recipe-meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
    .tag { padding:3px 6px; border-radius:4px; background:#f6f8fa; color:var(--muted); font-size:11px; }
    .recipe-link, .plant-link { display:inline-flex; align-items:center; min-height:34px; margin-top:auto; padding-top:10px; color:var(--green); font-size:12px; text-decoration:none; }
    .recipe-link:hover, .plant-link:hover { text-decoration:underline; }
    .empty { padding:24px 12px; border:1px dashed var(--line); border-radius:8px; color:var(--muted); text-align:center; }
    .plant { min-height:135px; }
    .plant .plant-icon { font-size:24px; }
    .notice { margin-top:22px; padding:12px 14px; border-left:3px solid var(--orange); background:#fff8c5; color:#5c4800; font-size:12px; }
    @media (max-width:720px) { .page { padding:18px 14px 28px; } .masthead { flex-direction:column; } .source-link { align-self:flex-start; } .recipe-grid,.plant-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:450px) { .recipe-grid,.plant-grid { grid-template-columns:1fr; } .recipe { min-height:150px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div><div class="eyebrow">HOME COOKING</div><h1>今天吃什么</h1><p class="intro">选中手边的食材，快速找到能做的菜。菜谱视频来自公开参考项目，点击后会在新页面打开。</p></div>
      <a class="source-link" href="https://cook.zhangjc.tech/" target="_blank" rel="noopener noreferrer">打开完整食谱库 ↗</a>
    </header>

    <section class="section" aria-labelledby="ingredientTitle">
      <div class="section-head"><h2 id="ingredientTitle">我有这些食材</h2><small id="selectedHint">未选择食材</small></div>
      <div class="ingredient-bar" id="ingredientBar" role="group" aria-label="食材筛选"></div>
      <div class="filter-row" role="group" aria-label="匹配模式">
        <span class="filter-label">匹配方式</span>
        <button class="mode" data-mode="any" aria-pressed="true" type="button">有一种就行</button>
        <button class="mode" data-mode="all" aria-pressed="false" type="button">全部包含</button>
        <button class="mode" data-mode="survival" aria-pressed="false" type="button">只用现有食材</button>
        <button class="clear" id="clearBtn" type="button">清空选择</button>
      </div>
      <p class="result-note" id="resultNote"></p>
      <div class="recipe-grid" id="recipeGrid" aria-live="polite"></div>
    </section>

    <section class="section" aria-labelledby="plantTitle">
      <div class="section-head"><h2 id="plantTitle">阳台种菜</h2><small>剩菜根也能重新长起来</small></div>
      <div class="plant-grid" id="plantGrid"></div>
    </section>

    <p class="notice">本页是独立的食材筛选入口，完整数据和更多视频请打开参考项目。视频会跳转到原发布平台，播放内容由第三方提供。</p>
  </main>
  <script>
    const recipes = [
      {name:'番茄牛腩焖饭',icon:'🍅',ingredients:['牛肉','番茄','米'],meta:['简单','电饭煲'],link:'https://www.bilibili.com/video/BV1Bv411C7X3'},
      {name:'蜜汁鸡翅',icon:'🍗',ingredients:['鸡肉'],meta:['简单','电饭煲'],link:'https://www.bilibili.com/video/BV1dj411f7sR'},
      {name:'土豆烤薯条',icon:'🥔',ingredients:['土豆'],meta:['零食','烤箱'],link:'https://www.bilibili.com/video/BV1nA411P7aX'},
      {name:'懒人腊肠焖饭',icon:'🍚',ingredients:['腊肠','米'],meta:['简单','电饭煲'],link:'https://www.bilibili.com/video/BV1NE411Q7Jj'},
      {name:'鸡蛋番茄面',icon:'🍜',ingredients:['鸡蛋','番茄','面食'],meta:['快手','煮'],link:'https://www.bilibili.com/video/BV1kW411r7Py'},
      {name:'一锅蔬菜烧烤',icon:'🥦',ingredients:['土豆','胡萝卜','洋葱','菌菇'],meta:['杂烩','烤箱'],link:'https://www.bilibili.com/video/BV17P4y1W7Ze'},
      {name:'肉饼蒸蛋',icon:'🥚',ingredients:['猪肉','鸡蛋'],meta:['家常','蒸'],link:'https://www.bilibili.com/video/BV13W411a7Ax'},
      {name:'香卤牛肉',icon:'🥩',ingredients:['牛肉','米'],meta:['卤味','电饭煲'],link:'https://www.bilibili.com/video/BV1dR4y1F7H2'},
      {name:'香菇腊肠饭',icon:'🍄',ingredients:['腊肠','菌菇','洋葱','米'],meta:['懒人','电饭煲'],link:'https://www.bilibili.com/video/BV1Bv411C7X3'}
    ];
    const plants = [
      {target:'空心菜',name:'水培空心菜',icon:'🌱',link:'https://www.bilibili.com/video/BV1DU4y1Z7jK'},
      {target:'蒜苗',name:'懒人种蒜苗',icon:'🧄',link:'https://www.bilibili.com/video/BV1kE411v7qL'},
      {target:'香菜',name:'沉浸式种香菜',icon:'🌿',link:'https://www.bilibili.com/video/BV1ou411e7NG'},
      {target:'番茄',name:'阳台水培番茄',icon:'🍅',link:'https://www.bilibili.com/video/BV1TF411H7HP'},
      {target:'葱',name:'阳台种葱',icon:'🧅',link:'https://www.bilibili.com/video/BV1va41127U6'},
      {target:'豌豆苗',name:'万物皆可种：豌豆苗',icon:'🌱',link:'https://www.bilibili.com/video/BV1rT4y117FB'}
    ];
    const ingredients=[...new Set(recipes.flatMap(recipe=>recipe.ingredients))];
    const selected=new Set(); let mode='any';
    const $=id=>document.getElementById(id);
    function renderIngredients(){ $('ingredientBar').innerHTML=ingredients.map(item=>`<button class="ingredient" type="button" aria-pressed="${selected.has(item)}" data-ingredient="${item}">${item}</button>`).join(''); document.querySelectorAll('[data-ingredient]').forEach(button=>button.addEventListener('click',()=>{const item=button.dataset.ingredient;if(selected.has(item))selected.delete(item);else selected.add(item);renderIngredients();renderRecipes();})); $('selectedHint').textContent=selected.size?`已选 ${selected.size} 种`:'未选择食材'; }
    function matches(recipe){if(!selected.size)return true;const set=new Set(recipe.ingredients);if(mode==='any')return [...selected].some(item=>set.has(item));if(mode==='all')return [...selected].every(item=>set.has(item));return recipe.ingredients.every(item=>selected.has(item));}
    function renderRecipes(){const visible=recipes.filter(matches);$('resultNote').textContent=selected.size?`找到 ${visible.length} 道匹配菜谱`:'先选食材，或直接浏览全部推荐';$('recipeGrid').innerHTML=visible.length?visible.map(recipe=>`<article class="recipe"><div class="recipe-top"><div><h3>${recipe.name}</h3><p>${recipe.ingredients.join(' · ')}</p></div><span class="dish-icon" aria-hidden="true">${recipe.icon}</span></div><div class="recipe-meta">${recipe.meta.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><a class="recipe-link" href="${recipe.link}" target="_blank" rel="noopener noreferrer">观看做法视频 ↗</a></article>`).join(''):'<div class="empty">没有找到匹配菜谱，试试“有一种就行”或少选一种食材。</div>';}
    function renderPlants(){$('plantGrid').innerHTML=plants.map(plant=>`<article class="plant"><div class="plant-icon" aria-hidden="true">${plant.icon}</div><h3>${plant.name}</h3><p>适合从${plant.target}开始</p><a class="plant-link" href="${plant.link}" target="_blank" rel="noopener noreferrer">查看种植视频 ↗</a></article>`).join('');}
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));renderRecipes();}));
    $('clearBtn').addEventListener('click',()=>{selected.clear();renderIngredients();renderRecipes();});
    renderIngredients();renderRecipes();renderPlants();
  </script>
</body>
</html>
