<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小游戏库</title>
  <style>
    :root { color-scheme:light; --ink:#1f2328; --muted:#57606a; --line:#d0d7de; --accent:#1f883d; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8fa; color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width:940px; margin:auto; padding:24px 20px 36px; }
    header { display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:22px; }
    h1 { margin:0; font-size:20px; } h2 { font-size:13px; margin:22px 0 10px; color:var(--muted); font-weight:600; }
    header span { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:9px; }
    a.game { display:flex; align-items:center; gap:11px; min-width:0; min-height:66px; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); text-decoration:none; }
    a.game:hover, a.game:focus-visible { border-color:var(--accent); background:#f0fbf2; outline:none; }
    .symbol { flex:none; display:grid; place-items:center; width:34px; height:34px; border-radius:5px; background:#eaeef2; font-size:18px; }
    .label { min-width:0; } .label strong { display:block; font-size:13px; } .label small { display:block; color:var(--muted); font-size:11px; }
    footer { border-top:1px solid var(--line); margin-top:25px; padding-top:14px; color:var(--muted); font-size:11px; }
    footer a { color:var(--muted); }
    @media(max-width:480px) { main { padding:18px 14px 28px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; } a.game { min-height:68px; padding:8px; gap:7px; } .symbol { width:29px; height:29px; font-size:16px; } .label strong { font-size:12px; } }
  </style>
</head>
<body>
<main>
  <header><h1>小游戏库</h1><span>12 款</span></header>
  <section aria-labelledby="classicTitle">
    <h2 id="classicTitle">经典游戏</h2>
    <nav class="grid" aria-label="经典游戏">
      <a class="game" href="tic-tac-toe/"><span class="symbol">○</span><span class="label"><strong>井字棋</strong><small>Tic-Tac-Toe</small></span></a>
      <a class="game" href="2048/"><span class="symbol">▦</span><span class="label"><strong>2048</strong><small>数字合并</small></span></a>
      <a class="game" href="minesweeper/"><span class="symbol">✹</span><span class="label"><strong>扫雷</strong><small>Minesweeper</small></span></a>
      <a class="game" href="memory/"><span class="symbol">▣</span><span class="label"><strong>翻牌记忆</strong><small>Memory Match</small></span></a>
      <a class="game" href="chess/"><span class="symbol">♞</span><span class="label"><strong>国际象棋</strong><small>Chess</small></span></a>
      <a class="game" href="connect-four/"><span class="symbol">●</span><span class="label"><strong>四子棋</strong><small>Connect Four</small></span></a>
      <a class="game" href="lights-out/"><span class="symbol">✦</span><span class="label"><strong>关灯</strong><small>Lights Out</small></span></a>
    </nav>
  </section>
  <section aria-labelledby="logicTitle">
    <h2 id="logicTitle">逻辑谜题</h2>
    <nav class="grid" aria-label="逻辑谜题">
      <a class="game" href="mini-sudoku/"><span class="symbol">#</span><span class="label"><strong>六宫数独</strong><small>Mini Sudoku</small></span></a>
      <a class="game" href="tango/"><span class="symbol">☀</span><span class="label"><strong>日月棋</strong><small>Tango</small></span></a>
      <a class="game" href="queens/"><span class="symbol">♛</span><span class="label"><strong>皇后谜题</strong><small>Queens</small></span></a>
      <a class="game" href="zip/"><span class="symbol">⌁</span><span class="label"><strong>连线</strong><small>Zip</small></span></a>
      <a class="game" href="patches/"><span class="symbol">▤</span><span class="label"><strong>矩形拼图</strong><small>Patches</small></span></a>
    </nav>
  </section>
  <footer>游戏原作 © Tejas Wavde · <a href="LICENSE" target="_blank" rel="noopener">MIT 许可</a> · <a href="https://github.com/wavde/games" target="_blank" rel="noopener">源项目</a></footer>
</main>
</body>
</html>
