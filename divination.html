<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摸鱼问卦</title>
  <style>
    :root{color-scheme:light;--ink:#263a36;--muted:#63736e;--line:#dce5df;--green:#285b4b;--paper:#f7f8f4}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    main{max-width:820px;margin:auto;padding:32px 24px 40px}header{margin-bottom:24px}header small{color:var(--green);letter-spacing:.12em}h1{font-size:30px;margin:4px 0 6px}p{margin:8px 0}header p,.note,footer{color:var(--muted);font-size:13px}
    nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:10px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{cursor:pointer}nav button{flex:1;min-width:110px;padding:10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted)}nav button[aria-pressed="true"]{color:var(--green);background:#e5eee8;border-color:#bdcfc3;font-weight:600}
    h2{font-size:20px;margin:0 0 4px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;font-size:13px;color:var(--muted)}input,select,textarea{display:block;width:100%;min-width:0;margin-top:6px;padding:10px 12px;background:#fff;color:var(--ink);border:1px solid #c7d4cc;border-radius:6px}textarea{resize:vertical;min-height:76px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}.full{grid-column:1/-1}
    .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}.primary,.secondary{border-radius:6px;padding:10px 18px;border:1px solid var(--green)}.primary{background:var(--green);color:#fff}.secondary{background:transparent;color:var(--green)}[hidden]{display:none!important}.notice{font-size:13px;color:var(--muted);margin-top:8px}.result{margin-top:28px;padding:24px;border-top:3px solid var(--green);background:#fff;animation:appear .25s ease-out}.result h2{font-size:26px;margin:5px 0 12px}.result .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}.result .poem{font-family:"STKaiti","KaiTi",serif;font-size:21px;line-height:1.9;white-space:pre-line;margin:18px 0}.result .detail{font-size:13px;color:var(--muted);padding-top:12px;margin-top:16px;border-top:1px solid var(--line)}footer{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}#error{color:#a33e37;font-size:13px}
    .result{overflow-wrap:anywhere}
    @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.result{animation:none}}@media(max-width:480px){main{padding:20px 16px}.fields,.fields.two{grid-template-columns:1fr}h1{font-size:26px}nav button{min-width:calc(50% - 6px)}.result{padding:20px 16px}}
  </style>
</head>
<body>
<main>
  <header><small>歇一会儿，问问心事</small><h1>摸鱼问卦</h1><p>掐指算一卦，或为心里的那个人求一支签。</p></header>
  <nav aria-label="选择问卦玩法"><button type="button" data-mode="liuren" aria-pressed="true">小六壬</button><button type="button" data-mode="sign" aria-pressed="false">姻缘签</button><button type="button" data-mode="zodiac" aria-pressed="false">生肖配对</button><button type="button" data-mode="direction" aria-pressed="false">姻缘方位</button></nav>
  <form id="liurenForm" data-panel="liuren">
    <h2>掐指一算</h2><p class="note">按农历月、日和时辰起卦，看看这件小事的传统卦象。</p>
    <div class="fields"><label>农历月<select id="lunarMonth"></select></label><label>农历日<select id="lunarDay"></select></label><label>时辰<select id="lunarHour"></select></label><label>问哪方面<select id="topic"><option value="daily">日常小事</option><option value="work">工作学习</option><option value="love">感情相处</option><option value="travel">出行安排</option><option value="lost">寻物</option></select></label><label class="full">心里的问题（可不填）<input id="liurenQuestion" maxlength="100" placeholder="例如：今天的计划怎么安排？"></label></div>
    <p class="note" id="lunarNote"></p><div class="actions"><button class="primary" type="submit">起一卦</button><button class="secondary" id="useNow" type="button">使用当前北京时间</button></div>
  </form>
  <form id="signForm" data-panel="sign" hidden>
    <h2>为心事求一支签</h2><p class="note">一百支姻缘签。同一昵称、同一问题，在北京时间同一天得到同一支签。</p>
    <div class="fields two"><label>你的昵称<input id="signName" required maxlength="20" autocomplete="off" placeholder="起一个你喜欢的名字"></label><label class="full">想问的感情问题<textarea id="signQuestion" required maxlength="100" placeholder="例如：我该如何靠近喜欢的人？"></textarea></label></div><button class="primary" type="submit">抽一支姻缘签</button>
  </form>
  <form id="zodiacForm" data-panel="zodiac" hidden>
    <h2>看看生肖的缘分</h2><p class="note">用六合、三合、六冲和六害做一次传统生肖简配。</p>
    <div class="fields two"><label>你的生肖<select id="zodiacA"></select></label><label>对方的生肖<select id="zodiacB"></select></label></div><button class="primary" type="submit">看看配对</button>
  </form>
  <form id="directionForm" data-panel="direction" hidden>
    <h2>缘分落在哪个方向</h2><p class="note">按农历生日，从寅月起月、月上数日。方位以出生地为参考。</p>
    <div class="fields two"><label>农历出生月<select id="birthMonth"></select></label><label>农历出生日<select id="birthDay"></select></label></div><button class="primary" type="submit">看看姻缘方位</button><p class="notice">闰月按同一月份计算。</p>
  </form>
  <p id="error" role="alert" hidden></p>
  <section id="result" class="result" role="status" aria-live="polite" hidden></section>
  <footer>传统文化小游戏 · 结果仅供娱乐。输入只在你的浏览器中计算，不会发到聊天室。</footer>
</main>
<script src="divination-signs.js"></script>
<script src="divination.js"></script>
</body>
</html>
